name: 定期ワークフロー維持

# 公開リポジトリの定期ワークフローが60日間の無活動で停止されないよう、
# 月1回だけ小さな活動記録をコミットします。
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: 活動記録を更新
        shell: bash
        run: |
          mkdir -p .github
          printf 'MAKIDrivePhotoAlbum workflow keepalive.\nLast update: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: keep scheduled workflows active"
          git push
